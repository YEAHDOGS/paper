<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PAPER — Fake money. Real lessons.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="paper-banner"><span>PAPER — FAKE MONEY · REAL LESSONS</span></div>

<header>
  <div class="brand">
    <h1><b>PAPER</b> TRADING</h1>
    <div style="text-align:right">
      <div class="equity-label">TOTAL EQUITY</div>
      <div class="equity mono" id="totalEquity">$0<small>.00</small></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">TOTAL P&amp;L</div><div class="v mono" id="statPnl">$0</div></div>
    <div class="stat"><div class="k">WIN RATE</div><div class="v mono" id="statWin">—</div></div>
    <div class="stat"><div class="k">OPEN</div><div class="v mono gold" id="statOpen">0</div></div>
  </div>
  <div class="feedline mono" id="live-ind"></div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="foot">
  PAPER is a simulator. Nothing here is real money, real advice, or a real order.<br>
  Data lives in this device's localStorage. Export a backup before switching devices.
</div>

<script src="app.js"></script>
</body>
</html>
